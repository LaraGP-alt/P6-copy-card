<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harvert Vase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --claro: #ffffff;
      --verde_claro: #6c9171;
      --oscuro: #1d1d1f;
      --verde: #6fd12b;

      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Poppins", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--verde_claro);
      font-family: var(--font-sans);
      color: var(--oscuro);
      overflow: hidden;
    }


    .card {
      display: flex;
      flex-direction: column;
      width: 85vw;
      max-width: 400px;
      height: 85vh;
      background: var(--claro);
      border-radius: 16px;
      overflow: hidden;
   
    }

    .card__image {
      height: 40%;
      background: var(--beige);
      overflow: hidden;
    }

    .card__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card__content {
      height: 60%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3vh 6vw;
      overflow: hidden;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
    }

    h2 {
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.5;
      margin: 0.3rem 0 0.6rem;
    }

    p {
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .card__footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .btn {
      font-family: var(--font-sans);
      background: var(--verde);
      color: var(--oscuro);
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.8;
      letter-spacing: 0.08em;
    }

 
    @media (min-width: 601px) {
      .card {
        flex-direction: row;
        width: 90vw;
        max-width: 700px;
        height: 50vh;
        min-height: 260px;
      }

      .card__image {
        width: 40%;
        height: 100%;
      }

      .card__content {
        width: 60%;
        height: 100%;
        padding: 4vh 3vw;
      }
    }
  </style>
</head>
<body>

  <article class="card">
    <div class="card__image">
      <img src="planta.jpg" alt="Planta monstera">
    </div>

    <div class="card__content">
      <div>
        <h1>Harvert Vase</h1>
        <h2>by studio friends</h2>
        <p>
         Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod
         tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim
         veniam, quis nostrud exercitation ullamco laboris.
        </p>
      </div>

      <div class="card__footer">
        <span class="price">78$</span>
        <button class="btn">BUY NOW</button>
      </div>
    </div>
  </article>

</body>
</html>
